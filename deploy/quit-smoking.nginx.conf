# 戒烟 PWA · 子目录部署配置（/quit-smoking/）
#
# 使用前提：
#   1. 站点文件在 /var/www/quit-smoking/
#   2. 根路径 / 已有其他项目，不要修改根 location
#   3. 修改后执行：nginx -t && systemctl reload nginx
#
# 说明：
#   - 不要用 alias + try_files，容易踩坑；这里用 root。
#   - 如果实际路径不是 /var/www，请同步修改两处 root。

# 补斜杠，避免相对路径按 /quit-smoking 解析
location = /quit-smoking {
    return 301 /quit-smoking/;
}

location /quit-smoking/ {
    root /var/www;
    index index.html;

    # 单页应用：未知路径回落到入口
    try_files $uri $uri/ /quit-smoking/index.html;

    # 入口页不强缓存，避免更新后拿到旧版本
    location = /quit-smoking/index.html {
        root /var/www;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# 静态资源缓存（按需启用）
location ~* ^/quit-smoking/.*\.(js|css|png|svg|webmanifest)$ {
    root /var/www;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}
